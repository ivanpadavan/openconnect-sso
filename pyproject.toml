[build-system]
requires = ["setuptools>=65,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "openconnect-sso"
version = "0.8.1+ivanpadavan.1"
description = "OpenConnect SSO client for Cisco AnyConnect authentication"
readme = "README.md"
requires-python = ">=3.8,<4"
license = {file = "LICENSE"}
authors = [{name = "László Vaskó"}]
dependencies = [
    "attrs>=18.2",
    "colorama>=0.4,<0.5",
    "keyring>=21.1,<24",
    "lxml>=4.3,<5",
    "prompt-toolkit>=3.0.3,<4",
    "pyotp>=2.7,<3",
    "PyQt6>=6.3,<7",
    "PyQt6-WebEngine>=6.3,<7",
    "PySocks>=1.7.1,<2",
    "pyxdg>=0.26,<0.29",
    "requests>=2.22,<3",
    "setuptools>=65,<81", # The Qt browser loads its script with pkg_resources.
    "structlog>=20.1",
    "toml>=0.10,<0.11",
]

[project.scripts]
openconnect-sso = "openconnect_sso.cli:main"

[project.urls]
Repository = "https://github.com/ivanpadavan/openconnect-sso"
Upstream = "https://github.com/vlaci/openconnect-sso"

[tool.setuptools]
packages = ["openconnect_sso", "openconnect_sso.browser"]
package-dir = {openconnect_sso = "."}

[tool.setuptools.package-data]
"openconnect_sso.browser" = ["user.js"]
